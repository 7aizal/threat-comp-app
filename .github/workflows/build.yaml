name: Build and Push Docker Image

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: threatcomp-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get ECR URI
        id: ecr
        run: |
          URI=$(aws ecr describe-repositories \
            --repository-names $ECR_REPOSITORY \
            --query 'repositories[0].repositoryUri' \
            --output text)

          echo "ECR_URI=$URI" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t $ECR_REPOSITORY:latest ./app

      - name: Tag Docker Image
        run: docker tag $ECR_REPOSITORY:latest $ECR_URI:latest

      - name: Push Docker Image
        run: docker push $ECR_URI:latest

      - name: Output Image URI
        run: | 
            echo "Pushed image: $ECR_URI:latest"
