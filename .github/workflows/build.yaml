name: Build and Push Docker Image

on:
  push:
    branches:
      - deployment
  workflow_dispatch:

env:
  AWS_REGION: eu-west-2
  ECR_REPOSITORY: threatcomp-app
  AWS_ACCOUNT_ID: 598130604507

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      
      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::598130604507:role/GitHubActions-Role
          aws-region: eu-west-2

      
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      
      - name: Ensure ECR Repository Exists
        run: |
          aws ecr describe-repositories --repository-names $ECR_REPOSITORY || \
          aws ecr create-repository --repository-name $ECR_REPOSITORY

      
      - name: Build Docker Image
        run: docker build -t $ECR_REPOSITORY:latest ./app

      
      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: threatcomp-app:latest
          severity: HIGH,CRITICAL
          exit-code: '1'
          ignore-unfixed: true
          format: table

      
      - name: Tag Docker Image
        run: |
          docker tag $ECR_REPOSITORY:latest \
            $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      
      - name: Push Docker Image
        run: |
          docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest

      - name: Output Image URI
        run: |
          echo "Pushed image: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:latest"
